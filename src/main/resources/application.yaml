server:
  # 后端固定使用 8080，前端 vite.config.js 的代理目标与此保持一致
  port: 8080

spring:
  application:
    name: traffic_management_backend
  datasource:
    # XAMPP(MySQL/MariaDB) 本机实例：localhost:3306，库名 traffic，账号 root 无密码
    url: jdbc:mysql://localhost:3306/traffic?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  # mapper XML 位于 src/main/resources/mapper，打包后同样位于 classpath:mapper
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.traffic_management.entity
  configuration:
    map-underscore-to-camel-case: true

# 马表仿真参数
sim:
  # 每轮循环的真实间隔（秒）
  tick-seconds: 5
  # 一轮循环代表现实中的分钟数（5 秒 = 5 分钟）
  minutes-per-tick: 5
  # 车辆统一速度（km/h）
  speed-kmh: 60
  # 装货 / 卸货 / 停留等待 的固定耗时（分钟）
  loading-minutes: 30
  unloading-minutes: 30
  waiting-minutes: 5
  # 每轮生成一条新运输任务的概率，以及待接单任务上限
  task-probability: 0.9
  # 每轮最多新增几条任务（实际按「空闲车辆数 - 待接单数」的缺口生成，50 辆车也能喂饱）
  tasks-per-tick: 5
  max-pending-tasks: 50
  # 高德「Web服务」类型 key（不是 JS API key）。留空则用合成路线兜底
  amap-web-key: ""
