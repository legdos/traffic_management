spring:
  application:
    name: traffic_management
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/transport_groupwork?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.traffic_management.entity
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8080}